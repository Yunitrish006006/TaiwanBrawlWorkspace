name: Validate Flutter Viewer

on:
  push:
    paths:
      - "apps/viewer_flutter/**"
      - "data/**"
      - "scripts/render-flutter-data.mjs"
      - ".github/workflows/flutter-viewer.yml"
  pull_request:
    paths:
      - "apps/viewer_flutter/**"
      - "data/**"
      - "scripts/render-flutter-data.mjs"
      - ".github/workflows/flutter-viewer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate viewer data from canonical workspace data
        run: node scripts/render-flutter-data.mjs
      - working-directory: apps/viewer_flutter
        run: flutter pub get
      - working-directory: apps/viewer_flutter
        run: flutter analyze
      - working-directory: apps/viewer_flutter
        run: flutter test
      - working-directory: apps/viewer_flutter
        run: flutter build web --release
