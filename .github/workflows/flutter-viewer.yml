name: Validate Flutter Viewer

on:
  push:
    paths: ["viewer_flutter/**", "data/**", "scripts/render-flutter-data.mjs", ".github/workflows/flutter-viewer.yml"]
  pull_request:
    paths: ["viewer_flutter/**", "data/**", "scripts/render-flutter-data.mjs", ".github/workflows/flutter-viewer.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: node scripts/render-flutter-data.mjs
      - working-directory: viewer_flutter
        run: flutter pub get
      - working-directory: viewer_flutter
        run: flutter analyze
      - working-directory: viewer_flutter
        run: flutter test
      - working-directory: viewer_flutter
        run: flutter build web --release
