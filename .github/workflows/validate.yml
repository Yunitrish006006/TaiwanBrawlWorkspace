name: Validate TaiwanBrawlWorkspace

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout architecture frontend source
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/taiwan_brawl_front
          ref: dfb95c46d1f397a68ab21aef66f6c4ace3f948d3
          path: _validation/taiwan_brawl_front
      - name: Checkout architecture backend source
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/taiwan_brawl_back
          ref: d5fff5cdeb24b7f4e8468929285c1763196d77e6
          path: _validation/taiwan_brawl_back
      - name: Expose sibling repository paths to boundary tests
        run: |
          mkdir -p "$RUNNER_TEMP/taiwan-brawl-validation"
          mv "$GITHUB_WORKSPACE/_validation/taiwan_brawl_front" "$RUNNER_TEMP/taiwan-brawl-validation/taiwan_brawl_front"
          mv "$GITHUB_WORKSPACE/_validation/taiwan_brawl_back" "$RUNNER_TEMP/taiwan-brawl-validation/taiwan_brawl_back"
          ln -s "$RUNNER_TEMP/taiwan-brawl-validation/taiwan_brawl_front" "$GITHUB_WORKSPACE/_validation/taiwan_brawl_front"
          ln -s "$RUNNER_TEMP/taiwan-brawl-validation/taiwan_brawl_back" "$GITHUB_WORKSPACE/_validation/taiwan_brawl_back"
          ln -s "$RUNNER_TEMP/taiwan-brawl-validation/taiwan_brawl_front" "$GITHUB_WORKSPACE/../taiwan_brawl_front"
          ln -s "$RUNNER_TEMP/taiwan-brawl-validation/taiwan_brawl_back" "$GITHUB_WORKSPACE/../taiwan_brawl_back"
          ln -s "$RUNNER_TEMP/taiwan-brawl-validation/taiwan_brawl_front/packages/shared/taiwan_brawl_core" "$GITHUB_WORKSPACE/../taiwan_brawl_core"
          ln -s "$RUNNER_TEMP/taiwan-brawl-validation/taiwan_brawl_front/packages/shared/taiwan_brawl_messaging" "$GITHUB_WORKSPACE/../taiwan_brawl_messaging"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Validate canonical workspace data and structure
        run: node scripts/validate-workspace.mjs
      - name: Generate transient Flutter input
        run: node scripts/render-flutter-data.mjs
      - name: Test model routing and execution budgets without model calls
        run: npm test
      - name: Validate generated JSON
        run: node -e "JSON.parse(require('fs').readFileSync('apps/viewer_flutter/assets/workspace-data.json','utf8'))"
      - name: Ensure generated viewer input stays untracked
        run: git check-ignore apps/viewer_flutter/assets/workspace-data.json
