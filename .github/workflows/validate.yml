name: Validate TaiwanBrawlWorkspace

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: node scripts/validate-workspace.mjs
      - run: node scripts/render-flutter-data.mjs
      - run: git diff --exit-code -- viewer_flutter/assets/workspace-data.json
