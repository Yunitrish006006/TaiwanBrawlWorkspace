name: Validate TaiwanBrawlWorkspace

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Validate canonical workspace data and structure
        run: node scripts/validate-workspace.mjs
      - name: Generate transient Flutter input
        run: node scripts/render-flutter-data.mjs
      - name: Validate generated JSON
        run: node -e "JSON.parse(require('fs').readFileSync('apps/viewer_flutter/assets/workspace-data.json','utf8'))"
      - name: Ensure generated viewer input stays untracked
        run: git check-ignore apps/viewer_flutter/assets/workspace-data.json
