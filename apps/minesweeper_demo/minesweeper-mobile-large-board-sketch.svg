<svg xmlns="http://www.w3.org/2000/svg" width="430" height="932" viewBox="0 0 430 932" role="img" aria-labelledby="title desc">
  <title id="title">踩地雷手機版 16x16 與 25x25 動態棋盤 UI 草圖</title>
  <desc id="desc">手機版大棋盤介面，支援 9x9、16x16、25x25，棋盤可透過拖曳上下左右移動。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#162b2b"/><stop offset="1" stop-color="#29453d"/></linearGradient>
    <pattern id="cells" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#5d806b"/><path d="M24 0H0V24" fill="none" stroke="#d2bd7a" stroke-width="1.5"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#071817" flood-opacity=".35"/></filter>
    <clipPath id="boardWindow"><rect x="39" y="263" width="352" height="352" rx="14"/></clipPath>
  </defs>
  <rect width="430" height="932" rx="34" fill="url(#bg)"/>
  <g font-family="system-ui, sans-serif">
    <text x="28" y="36" fill="#f6e7b4" font-size="13" font-weight="700">9:41</text>
    <text x="28" y="83" fill="#f6e7b4" font-size="22" font-weight="900">踩地雷</text>
    <text x="28" y="106" fill="#9db5a2" font-size="12" letter-spacing="2">LARGE BOARD · DRAG TO EXPLORE</text>
    <circle cx="386" cy="83" r="21" fill="#36564b" stroke="#688873"/><path d="M378 83h16M386 75v16" stroke="#e6be5b" stroke-width="3" stroke-linecap="round"/>

    <!-- board-size selector -->
    <g transform="translate(24 132)">
      <text y="16" fill="#9db5a2" font-size="11" font-weight="800" letter-spacing="2">BOARD SIZE</text>
      <rect y="28" width="382" height="48" rx="15" fill="#294a40" stroke="#688873"/>
      <rect x="8" y="36" width="116" height="32" rx="10" fill="#36564b"/><text x="66" y="57" text-anchor="middle" fill="#9db5a2" font-size="14" font-weight="700">9 × 9</text>
      <rect x="133" y="36" width="116" height="32" rx="10" fill="#e6be5b"/><text x="191" y="57" text-anchor="middle" fill="#294a40" font-size="14" font-weight="900">16 × 16</text>
      <rect x="258" y="36" width="116" height="32" rx="10" fill="#36564b"/><text x="316" y="57" text-anchor="middle" fill="#9db5a2" font-size="14" font-weight="700">25 × 25</text>
    </g>

    <!-- stats -->
    <g transform="translate(24 230)">
      <rect width="382" height="58" rx="15" fill="#f6e7b4"/>
      <text x="18" y="24" fill="#66806d" font-size="11" font-weight="800">剩餘地雷</text><text x="18" y="46" fill="#294a40" font-size="21" font-family="ui-monospace, monospace" font-weight="900">42</text>
      <path d="M126 10v38M253 10v38" stroke="#c5aa64" stroke-width="2"/>
      <text x="145" y="24" fill="#66806d" font-size="11" font-weight="800">時間</text><text x="145" y="46" fill="#294a40" font-size="21" font-family="ui-monospace, monospace" font-weight="900">04:18</text>
      <text x="272" y="24" fill="#66806d" font-size="11" font-weight="800">視窗</text><text x="272" y="46" fill="#294a40" font-size="21" font-weight="900">16×16</text>
    </g>

    <!-- pannable board viewport -->
    <g filter="url(#shadow)">
      <rect x="24" y="248" width="382" height="382" rx="20" fill="#294a40"/>
      <rect x="39" y="263" width="352" height="352" rx="14" fill="#5d806b"/>
      <g clip-path="url(#boardWindow)">
        <!-- oversized 25x25 board, intentionally larger than viewport -->
        <rect x="-30" y="-20" width="600" height="600" fill="url(#cells)" transform="translate(0 0) rotate(0 190 439)"/>
        <g font-family="ui-monospace, monospace" font-size="18" font-weight="900" text-anchor="middle" dominant-baseline="middle">
          <text x="66" y="306" fill="#f2e2ac">1</text><text x="90" y="330" fill="#e6be5b">⚑</text><text x="138" y="354" fill="#d46e4c">2</text><text x="210" y="402" fill="#3b72a1">1</text><text x="282" y="450" fill="#d46e4c">3</text><text x="330" y="498" fill="#3b72a1">1</text><text x="186" y="546" fill="#e6be5b">⚑</text><text x="354" y="570" fill="#d46e4c">2</text>
        </g>
        <rect x="183" y="408" width="48" height="48" fill="#83a48a" stroke="#e6be5b" stroke-width="4"/>
      </g>
    </g>
    <text x="215" y="651" text-anchor="middle" fill="#f6e7b4" font-size="13" font-weight="800">拖曳棋盤探索其他格子</text>
    <text x="215" y="671" text-anchor="middle" fill="#9db5a2" font-size="12">上下左右皆可滑動 · 點擊翻開 · 長按插旗</text>

    <rect x="24" y="703" width="382" height="58" rx="17" fill="#e6be5b"/>
    <text x="215" y="739" text-anchor="middle" fill="#294a40" font-size="15" font-weight="900">重新開始 16 × 16</text>
    <rect x="24" y="779" width="382" height="54" rx="16" fill="#345449" stroke="#688873"/>
    <text x="215" y="813" text-anchor="middle" fill="#f6e7b4" font-size="14" font-weight="800">切換至 25 × 25</text>
    <text x="215" y="878" text-anchor="middle" fill="#789184" font-size="12" letter-spacing="1">SAFE CELLS  /  214 OF 256</text>
    <path d="M175 902h80" stroke="#688873" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
