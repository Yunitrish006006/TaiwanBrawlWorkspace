<svg xmlns="http://www.w3.org/2000/svg" width="430" height="932" viewBox="0 0 430 932" role="img" aria-labelledby="title desc">
  <title id="title">Taiwan Brawl 踩地雷手機版 UI 草圖</title>
  <desc id="desc">手機直式踩地雷遊戲介面，包含頂部狀態、九乘九棋盤、底部操作列與重新開始按鈕。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#162b2b"/><stop offset="1" stop-color="#29453d"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#71937b"/><stop offset="1" stop-color="#4d705d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#071817" flood-opacity=".35"/></filter>
  </defs>
  <rect width="430" height="932" rx="34" fill="url(#bg)"/>
  <path d="M0 770c112-51 198 18 310-25 49-19 83-21 120-9v196H0Z" fill="#112525" opacity=".55"/>

