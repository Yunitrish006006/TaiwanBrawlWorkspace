    <text x="28" y="106" fill="#9db5a2" font-size="12" letter-spacing="2">TAIWAN BRAWL · DAILY BOARD</text>
    <circle cx="386" cy="83" r="21" fill="#36564b" stroke="#688873"/>
    <path d="M378 83h16M386 75v16" stroke="#e6be5b" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- compact stats -->
  <g transform="translate(24 132)" filter="url(#shadow)">
    <rect width="382" height="80" rx="18" fill="#f6e7b4"/>
    <rect x="12" y="12" width="170" height="56" rx="13" fill="#294a40"/>
    <path d="M32 31v20M32 31l18 8-18 8" stroke="#e6be5b" stroke-width="3"/><path d="M32 51h18" stroke="#e6be5b" stroke-width="3"/>
