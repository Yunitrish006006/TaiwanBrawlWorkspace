<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>街角拾荒 · 尺寸檢查</title><style>body{margin:0;background:#293d3b;color:#e8dfcb;font:14px system-ui}header{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{padding:12px;font:inherit}iframe{display:block;border:0;height:85vh;margin:auto;max-width:100%}a{color:inherit}output{display:block;text-align:center}</style><header>CSS viewport 檢查（不代表真機驗證）<button data-width="320">320</button><button data-width="390">390</button><button data-width="768">768</button><button data-width="1280">1280</button><button id="measure">量測排版</button><a href="/">開啟原頁</a></header><output id="metrics"></output><iframe title="遊戲預覽" src="/" width="390"></iframe><script>const frame=document.querySelector('iframe');document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{frame.width=b.dataset.width;});document.querySelector('#measure').onclick=()=>{const d=frame.contentDocument,buttons=[...d.querySelectorAll('.cell,.toolbar button')].map(e=>e.getBoundingClientRect());document.querySelector('#metrics').textContent=`viewport ${d.documentElement.clientWidth}px / content ${d.documentElement.scrollWidth}px / 最小棋盤及工具按鈕 ${Math.min(...buttons.map(r=>Math.min(r.width,r.height))).toFixed(1)}px / 內文 ${frame.contentWindow.getComputedStyle(d.querySelector('.hint')).fontSize}`;};</script></html>
<style>iframe{max-width:none}</style>
